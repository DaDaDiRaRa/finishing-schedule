# Google Cloud Build — 단일 컨테이너 (FastAPI가 React 빌드 서빙)
# 수동 실행: gcloud builds submit --config cloudbuild.yaml

substitutions:
  _REGION: asia-northeast3
  _AR_REPO: finishing-schedule
  _SERVICE: finishing-schedule-app
  _IMAGE: asia-northeast3-docker.pkg.dev/$PROJECT_ID/finishing-schedule/app

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}:$BUILD_ID
      - -t
      - ${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_IMAGE}
    waitFor: [build]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
    waitFor: [push]

images:
  - ${_IMAGE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
